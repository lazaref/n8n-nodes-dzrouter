
# Publishes the n8n community node package to npm on version tag pushes.
# Authentication uses npm Trusted Publishing (OIDC).
# npm provenance is generated by GitHub Actions.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update npm for Trusted Publishing
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
